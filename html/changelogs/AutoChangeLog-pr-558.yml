author: "Minomato"
delete-after: True
changes:
  - qol: "changed description on Airgun pressure values to be more intelligible"
  - qol: "game satchels can now be salvaged"
  - qol: "harpoon guns can now be worn on back slots"
  - balance: "game satchels, miner satchels have had their recipe cost and salvage yield reduced to 1."
  - balance: "duelist gloves and fencer's gloves have had their crafting cost reduced from 3 to 2.\n> UPDATE 10/1/26:\n> _~~balance: knife sheaths and scabbards cost less leather (2->1) and require less skill (T2->T1) to create.~~_\n> balance: knife sheaths and scabbards cost less leather (2->1)."
  - bugfix: "Automaton Golems & Androids now have cleaned-up description formatting and all traits/attribute changes listed."
  - bugfix: "Automatons now can use all pronouns (was only 'it' before)"
  - bugfix: "Vultura description clarified for dietary trait, removed commented-out code on the GOOP cough cooldown that somehow returned\nUPDATE 9/24/26"
  - rscadd: "added eyewear to the Artificer's Bench as crafting options: Spectacles (Copper, Glass Pane; Novice), Golden Spectacles (Gold, Glass Pane; Novice), Engineering Goggles (Bronze, Glass Pane; Novice), Monocle (Silver, Glass Pane; Novice) Smokey Onyxa Spectacles (Silver, Onyxa; Novice); Inquisitor Spectacles (Silver, Rontz; Journeyman)"
  - rscadd: "New Nighteye Goggles (Steel ingot, +1 glass pane, +1 gear) (expert), grant darkvision while worn."
  - qol: "all Artificer Bench recipes now list correct required additional items, followed by required skill level."
  - qol: "various recipes now take less hammers_per_item at the Artificer Bench."
  - qol: "Steam Grenades recipe now properly lists: (+2 Metal Gears; Apprentice)"
  - balance: "Engineering Wrench Recipe is now (Bronze, + 1 Bronze; Apprentice)"
  - balance: "Cooling Backpack (Bronze, +1 Backpack, +2 Metal Gears) now only requires Expert in Engineering"
  - balance: "Dwarven Music Box (Bronze, +2 Bronze, +2 Cogs, +1 Amythortz) now only requires Expert, Amythest requirement changed to Amythortz to match in-game name."
  - balance: "Lead Cannoball (+3 Iron) now requires only Expert instead of Mastery."
  - balance: "Lockpicks up from x3 to x5, Lockpick Rings up from x1 to x3 (in line with Blacksmithing); both now only require Novice Engineering."
  - balance: "Gold Prosthetics recipes lowered from Mastery to Expert."
  - balance: "all amulets, no matter variant, require only Apprentice Engineering to craft at an Artificer's Bench."
  - balance: "Jingle Bells recipe is now Novice.\n**UPDATE 10/1/26:"
  - rscadd: "proliferated most non-redundant dye bin colors to Loadout Dye selection"
  - rscadd: "expensive dyes: Deep Crimson #8b0000, Madder Red #8b2020, Midnight Teal #00627b"
  - rscadd: "royal dyes: Deep Orange #c95203, Kings Scarlet #cc2200, Onyx Black #1a1a1a and Sunset Orange #e06b1d"
  - rscadd: "cheap dyes: Bone White #f0ead6, Undyed Linen #d4c5a9"
  - bugfix: "renamed Scarlet -> Vicious Red, referring files now use 'Vicious Red'"
  - bugfix: "renamed Sky Blue (#40445f) -> Midnight Blue, referring files now use 'Midnight Blue'"
  - bugfix: "Maroon now uses #5a1a20 instead of #533727"
  - qol: "Loadout Dyes are arranged to be shown by order of similar hues"
  - qol: "Loadout Dyes no longer cost Triumph points"